[package]
name = "deputypwa"
version = "0.1.0"
description = "Always-on companion PWA for deputyOS appliance images."
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "deputypwa"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# Path dep so we can reuse limits/cost/doctor types directly when the
# subprocess JSON shapes already match deputyctl's library types.
deputyctl = { path = "../deputyctl" }
anyhow = "1.0"
axum = { version = "0.7", features = ["macros"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "time", "net"] }
tower-http = { version = "0.5", features = ["fs", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# ISO timestamps in dashboard rendering; same minimal-feature set deputywizard uses.
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json"] }
tempfile = "3"

[lints]
workspace = true
