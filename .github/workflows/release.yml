---
name: release

# Triggered on a CalVer tag push (`v2026.7.27`, `v2026.8.4`, …). Thin wrapper
# around make targets — every step is `make <target>`. The same flow runs
# locally on a contributor laptop with `make matrix && make manifest && make
# publish-cdn`. No CI-only logic.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "CalVer release, e.g. 2026.7.27 (omit the 'v' prefix)."
        required: true
        default: "2026.7.27"

permissions:
  contents: write
  id-token: write

env:
  DEPUTYOS_RELEASE_TAG: ${{ github.event.inputs.release_version && format('v{0}', github.event.inputs.release_version) || github.ref_name }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Wait for the native-runner launcher builds so their mac/win binaries can
    # be folded into the signed manifest's `desktop_launchers` (otherwise the
    # manifest only advertises the Linux launcher and self-update is Linux-only).
    needs: launchers
    env:
      DEPUTYOS_RELEASE_VERSION: ${{ github.event.inputs.release_version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage release signing key and API JWT public key
        shell: bash
        env:
          RELEASE_KEY_CONTENT: ${{ secrets.DEPUTYOS_RELEASE_KEY }}
          RELEASE_PUBKEY_CONTENT: ${{ secrets.DEPUTYOS_RELEASE_PUBKEY }}
          API_PUBKEY_PEM: ${{ secrets.DEPUTYOS_API_PUBKEY }}
        run: |
          test -n "$RELEASE_KEY_CONTENT" || { echo "::error::DEPUTYOS_RELEASE_KEY secret is empty"; exit 1; }
          test -n "$RELEASE_PUBKEY_CONTENT" || { echo "::error::DEPUTYOS_RELEASE_PUBKEY secret is empty"; exit 1; }
          test -n "$API_PUBKEY_PEM" || { echo "::error::DEPUTYOS_API_PUBKEY secret is empty"; exit 1; }
          release_key_path="$RUNNER_TEMP/deputyos-release.key"
          release_pubkey_path="$RUNNER_TEMP/deputyos-release.pub"
          api_pubkey_path="$RUNNER_TEMP/deputyos-api-pubkey.pem"
          printf '%s\n' "$RELEASE_KEY_CONTENT" > "$release_key_path"
          printf '%s\n' "$RELEASE_PUBKEY_CONTENT" > "$release_pubkey_path"
          printf '%s\n' "$API_PUBKEY_PEM" > "$api_pubkey_path"
          chmod 600 "$release_key_path"
          chmod 644 "$release_pubkey_path"
          chmod 644 "$api_pubkey_path"
          {
            echo "DEPUTYOS_RELEASE_KEY=$release_key_path"
            echo "DEPUTYOS_RELEASE_PUBKEY_FILE=$release_pubkey_path"
            echo "DEPUTYOS_DESKTOP_EMBEDDED_PUBKEY=$release_pubkey_path"
            echo "DEPUTYOS_API_PUBKEY_FILE=$api_pubkey_path"
          } >> "$GITHUB_ENV"

      - name: Install host deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y yamllint shellcheck \
            minisign qemu-system-arm qemu-user-static xz-utils rclone

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ansible.txt

      - name: Install pinned Ansible toolchain
        run: |
          python -m venv "$RUNNER_TEMP/deputyos-ansible"
          "$RUNNER_TEMP/deputyos-ansible/bin/pip" install -r requirements-ansible.txt
          echo "$RUNNER_TEMP/deputyos-ansible/bin" >> "$GITHUB_PATH"

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements-ansible.yml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91.1"

      - name: Build matrix
        run: make matrix CHANNEL=stable

      - name: Stage manifest-conforming release artefacts
        run: |
          release_version="${DEPUTYOS_RELEASE_VERSION#v}"
          make stage-release-artifacts \
            DEPUTYOS_RELEASE_VERSION="$release_version" \
            CHANNEL=stable

      - name: Build desktop launchers (Linux x86_64)
        run: make desktop-launcher DESKTOP_TARGET=x86_64-unknown-linux-gnu

      - name: Fetch mac/win launcher binaries (from the launchers job)
        uses: actions/download-artifact@v4
        with:
          pattern: launcher-*
          path: build/
          merge-multiple: true

      - name: Stage all launcher binaries for the manifest
        # `make desktop-launcher` already staged the Linux one as
        # build/deputyos-desktop-<triple>; the downloaded artifacts land under
        # the same naming (see the launchers job). manifest.sh globs
        # build/deputyos-desktop-* → desktop_launchers[triple].
        run: ls -la build/deputyos-desktop-* || true

      - name: Sign artefacts (release key from secret)
        run: make sign-release

      - name: Generate release manifest and publish to Backblaze B2 CDN
        # Artefact CDN is a B2 bucket fronted by Cloudflare (Bandwidth Alliance).
        # rclone speaks B2 natively; the `b2:` remote scheme selects the backend.
        env:
          DEPUTYOS_KEY_MODE: release
          RCLONE_CONFIG_B2_TYPE: b2
          RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_KEY_ID }}
          RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          DEPUTYOS_CDN_REMOTE: b2:cdn-deputyos-com
        run: make publish-cdn DEPUTYOS_RELEASE_VERSION="${DEPUTYOS_RELEASE_VERSION#v}" CHANNEL=stable

      - name: Attach artefacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DEPUTYOS_RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/**/*.qcow2
            dist/**/*.img.xz
            dist/**/manifest.json
            dist/**/manifest.json.minisig
            dist/**/*.cdx.json
            dist/**/*.intoto.jsonl
            target/release/deputyos-desktop
            target/release/deputyctl

  # Cross-platform launcher builds. These run in parallel on native runners
  # and attach their artefacts to the same release.
  launchers:
    name: launchers (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: deputyos-desktop-linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: DeputyOS-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: DeputyOS-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: deputyos-desktop-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Stage embedded release verification key
        shell: bash
        env:
          RELEASE_PUBKEY_CONTENT: ${{ secrets.DEPUTYOS_RELEASE_PUBKEY }}
        run: |
          test -n "$RELEASE_PUBKEY_CONTENT" || { echo "::error::DEPUTYOS_RELEASE_PUBKEY secret is empty"; exit 1; }
          release_pubkey_path="$RUNNER_TEMP/deputyos-release.pub"
          printf '%s\n' "$RELEASE_PUBKEY_CONTENT" > "$release_pubkey_path"
          echo "DEPUTYOS_DESKTOP_EMBEDDED_PUBKEY=$release_pubkey_path" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91.1"
          targets: ${{ matrix.target }}

      - name: Install Linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update -qq && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build desktop launcher
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build -p deputyos-desktop --release --target ${{ matrix.target }}

      - name: Stage launcher with manifest-conforming name
        # manifest.sh's desktop_launchers globs build/deputyos-desktop-<triple>
        # (no .exe). Copy the built binary to that name so the ubuntu
        # build-and-publish job can fold it into the signed manifest.
        shell: bash
        run: |
          mkdir -p build
          src="target/${{ matrix.target }}/release/deputyos-desktop"
          [ -f "$src" ] || src="target/${{ matrix.target }}/release/deputyos-desktop.exe"
          cp "$src" "build/deputyos-desktop-${{ matrix.target }}"
          cp "$src" "build/${{ matrix.binary }}"

      - name: Upload launcher binary (for the manifest job)
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.target }}
          path: build/deputyos-desktop-${{ matrix.target }}
          if-no-files-found: error

      - name: Attach launcher to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DEPUTYOS_RELEASE_TAG }}
          files: build/${{ matrix.binary }}

  # deputyOS Console — the GUI app. Bundle native installers on each OS's
  # native runner (Tauri can't cross-bundle) and attach them to the release.
  # Unsigned by default: the signing steps are gated on the signing secrets
  # being present, so forks / pre-cert releases still produce working (if
  # Gatekeeper/SmartScreen-warned) installers. See docs/how-to/desktop-console.md.
  console-bundle:
    name: console-bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle_glob: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
          - os: macos-latest
            bundle_glob: target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundle_glob: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v4

      - name: Stage embedded release verification key
        shell: bash
        env:
          RELEASE_PUBKEY_CONTENT: ${{ secrets.DEPUTYOS_RELEASE_PUBKEY }}
        run: |
          test -n "$RELEASE_PUBKEY_CONTENT" || { echo "::error::DEPUTYOS_RELEASE_PUBKEY secret is empty"; exit 1; }
          release_pubkey_path="$RUNNER_TEMP/deputyos-release.pub"
          printf '%s\n' "$RELEASE_PUBKEY_CONTENT" > "$release_pubkey_path"
          echo "DEPUTYOS_DESKTOP_EMBEDDED_PUBKEY=$release_pubkey_path" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91.1"

      - name: Install Linux webview deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Install tauri-cli
        run: cargo install tauri-cli --locked --version "^2.0"

      - name: Build bundles (unsigned)
        # Signing is deferred: if APPLE_SIGNING_IDENTITY / WINDOWS cert secrets
        # are wired later, add codesign/notarize + Authenticode steps here. For
        # now the artifacts are unsigned and the docs cover the OS bypass.
        working-directory: deputyos-console
        run: cargo tauri build

      - name: Note unsigned build
        shell: bash
        run: echo "::notice::deputyOS Console (${{ matrix.os }}) built UNSIGNED — users bypass Gatekeeper/SmartScreen per docs/how-to/desktop-console.md."

      - name: Attach installers to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DEPUTYOS_RELEASE_TAG }}
          files: ${{ matrix.bundle_glob }}
