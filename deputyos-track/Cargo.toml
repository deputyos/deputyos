[package]
name = "deputyos-track"
version = "0.1.0"
description = "Release-tracker bot: polls upstream profile repositories on GitHub and proposes pinned_version bumps."
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "deputyos-track"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

[lints]
workspace = true
