---
# OpenClaw profile bake — Lane F, M1 phase 2.
# Reference: docs/02-profiles.md §"Adding a third profile",
#            docs/03-image-builds.md §"Hermetic build properties",
#            docs/09-security.md §AppArmor.
#
# Contract: when this task file finishes, the image contains
#   * /opt/deputyos/profiles/openclaw/             (install root, agent:agent 0755)
#   * /home/agent/.openclaw/                      (data dir, agent:agent 0700)
#   * Node {{ openclaw_node_version }} runtime
#   * either real openclaw@{{ openclaw_pinned_version }} OR the stub binary
#   * /etc/systemd/system/openclaw-gateway.service (enabled, not started)
#   * /etc/apparmor.d/deputyos.openclaw            (enforce mode)
#   * /opt/deputyos/profiles/openclaw/.bake-meta   (read by `deputyctl version`)
# Nothing is started here — first boot of the qcow2 starts the unit.

- name: Set OpenClaw bake defaults  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    openclaw_install_root: "/opt/deputyos/profiles/openclaw"
    openclaw_data_dir: "/home/agent/.openclaw"
    openclaw_unit_name: "openclaw-gateway.service"
    openclaw_entrypoint: "openclaw onboard --daemon"
    openclaw_pinned_version: "{{ openclaw_pinned_version | default('2026.4.25') }}"
    # Node 22.11.0 LTS — Node 24 is not yet released as LTS at time of writing
    # (Node 22 is "Active LTS" through 2026-10; Node 24 enters LTS 2026-10).
    # The profile manifest's node_version="24" is a forward-looking pin; we
    # bake the closest active LTS today and bump in M2 when 24.x ships LTS.
    openclaw_node_version: "{{ openclaw_node_version | default('22.11.0') }}"
    openclaw_force_stub: "{{ openclaw_force_stub | default(false) }}"
  tags: [profile, openclaw]

- name: Ensure OpenClaw install root exists
  ansible.builtin.file:
    path: "{{ openclaw_install_root }}"
    state: directory
    owner: agent
    group: agent
    mode: "0755"
  tags: [profile, openclaw]

- name: Ensure OpenClaw data dir exists
  ansible.builtin.file:
    path: "{{ openclaw_data_dir }}"
    state: directory
    owner: agent
    group: agent
    mode: "0700"
  tags: [profile, openclaw]

- name: Ensure deputyOS profile config dir exists
  ansible.builtin.file:
    path: /etc/deputyos/openclaw/channels.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [profile, openclaw]

- name: Touch channels.d sentinel (wizard populates at first boot)
  ansible.builtin.copy:
    content: ""
    dest: /etc/deputyos/openclaw/channels.d/.gitkeep
    owner: root
    group: root
    mode: "0644"
    force: false
  tags: [profile, openclaw]

# --- Node runtime --------------------------------------------------------
# We pin Node via the NodeSource apt repo. NodeSource ships signed packages
# for arm64 + amd64 across Debian bookworm and Ubuntu jammy/noble (matches
# meta/main.yml platforms). Idempotent: apt is a no-op when the version matches.

- name: Install NodeSource apt prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - netcat-openbsd  # required by the stub fallback (nc.openbsd)
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [profile, openclaw]

- name: Add NodeSource apt signing key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    owner: root
    group: root
    mode: "0644"
    force: false
  register: _nodesource_key  # noqa: var-naming[no-role-prefix]
  retries: 3
  delay: 5
  until: _nodesource_key is success
  failed_when: false
  tags: [profile, openclaw]

- name: Add NodeSource apt repository  # noqa: name[template]
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture | replace('aarch64', 'arm64') | replace('x86_64', 'amd64') }}
      signed-by=/etc/apt/keyrings/nodesource.asc]
      https://deb.nodesource.com/node_{{ openclaw_node_version.split('.')[0] }}.x
      nodistro main
    filename: nodesource
    state: present
    update_cache: true
  when: _nodesource_key is success
  failed_when: false
  tags: [profile, openclaw]

- name: Install pinned Node.js  # noqa: name[template]
  ansible.builtin.apt:
    name: "nodejs={{ openclaw_node_version }}-1nodesource1"
    state: present
    allow_downgrade: true
  register: _node_install  # noqa: var-naming[no-role-prefix]
  failed_when: false
  tags: [profile, openclaw]

- name: Fallback — install distro Node if NodeSource pin unavailable
  ansible.builtin.apt:
    name: nodejs
    state: present
  when: _node_install is failed or _node_install.rc | default(0) != 0
  tags: [profile, openclaw]

# --- OpenClaw install ---------------------------------------------------
# Try the real npm install with retries. If it fails (offline build env, npm
# registry hiccup, yanked version), fall back to the stub script. The stub
# satisfies the smoke harness; CI bake-time failures get surfaced via the
# .bake-meta `stub=true` flag that `deputyctl version` reads.

- name: Install OpenClaw from npm  # noqa: name[template]
  ansible.builtin.command:
    cmd: >-
      npm install --prefix {{ openclaw_install_root }}
      --no-audit --no-fund --no-progress
      openclaw@{{ openclaw_pinned_version }}
    creates: "{{ openclaw_install_root }}/node_modules/openclaw/package.json"
  become: true
  become_user: agent
  environment:
    HOME: /home/agent
    npm_config_cache: "{{ openclaw_install_root }}/.npm-cache"
  register: openclaw_install  # noqa: var-naming[no-role-prefix]
  retries: 3
  delay: 10
  until: openclaw_install is success
  failed_when: false
  changed_when: openclaw_install.rc == 0
  when: not (openclaw_force_stub | bool)
  tags: [profile, openclaw]

- name: Detect whether real OpenClaw landed
  ansible.builtin.stat:
    path: "{{ openclaw_install_root }}/node_modules/.bin/openclaw"
  register: _openclaw_real_bin  # noqa: var-naming[no-role-prefix]
  tags: [profile, openclaw]

- name: Decide stub vs real  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    openclaw_use_stub: >-
      {{ (openclaw_force_stub | bool)
         or (not _openclaw_real_bin.stat.exists)
         or (openclaw_install is defined
             and openclaw_install.rc | default(1) != 0) }}
  tags: [profile, openclaw]

- name: Ensure node_modules/.bin/ exists for stub drop
  ansible.builtin.file:
    path: "{{ openclaw_install_root }}/node_modules/.bin"
    state: directory
    owner: agent
    group: agent
    mode: "0755"
  when: openclaw_use_stub | bool
  tags: [profile, openclaw]

- name: Drop OpenClaw stub binary (fallback)
  ansible.builtin.copy:
    src: openclaw-stub.sh
    dest: "{{ openclaw_install_root }}/node_modules/.bin/openclaw"
    owner: agent
    group: agent
    mode: "0755"
  when: openclaw_use_stub | bool
  tags: [profile, openclaw]

# --- systemd unit -------------------------------------------------------

- name: Render OpenClaw gateway systemd unit
  ansible.builtin.template:
    src: openclaw-gateway.service.j2
    dest: "/etc/systemd/system/{{ openclaw_unit_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
  tags: [profile, openclaw]

- name: Verify systemd unit (best-effort)
  ansible.builtin.command:
    cmd: "systemd-analyze verify /etc/systemd/system/{{ openclaw_unit_name }}"
  changed_when: false
  failed_when: false
  register: _unit_verify  # noqa: var-naming[no-role-prefix]
  tags: [profile, openclaw]

- name: Surface systemd-analyze findings (non-fatal)
  ansible.builtin.debug:
    msg: "{{ _unit_verify.stderr_lines | default([]) }}"
  when: _unit_verify.rc | default(0) != 0
  tags: [profile, openclaw]

- name: Enable OpenClaw gateway service (do not start at bake)
  ansible.builtin.systemd:
    name: "{{ openclaw_unit_name }}"
    enabled: true
    daemon_reload: true
  tags: [profile, openclaw]

# --- AppArmor profile ---------------------------------------------------

- name: Drop OpenClaw AppArmor profile
  ansible.builtin.copy:
    src: apparmor/deputyos.openclaw
    dest: /etc/apparmor.d/deputyos.openclaw
    owner: root
    group: root
    mode: "0644"
  notify: Reload AppArmor
  tags: [profile, openclaw, apparmor]

- name: Validate AppArmor profile syntax (best-effort)
  ansible.builtin.command:
    cmd: apparmor_parser -Q -K /etc/apparmor.d/deputyos.openclaw
  changed_when: false
  failed_when: false
  register: _aa_verify  # noqa: var-naming[no-role-prefix]
  tags: [profile, openclaw, apparmor]

- name: Fail if AppArmor profile is malformed
  ansible.builtin.fail:
    msg: "AppArmor profile failed to parse: {{ _aa_verify.stderr | default('(no stderr)') }}"
  when:
    - _aa_verify.rc is defined
    - _aa_verify.rc != 0
    - "'apparmor_parser' in _aa_verify.stderr | default('')
        or 'syntax' in _aa_verify.stderr | default('') | lower"
  tags: [profile, openclaw, apparmor]

# --- Bake metadata (read by deputyctl version) ---------------------------

- name: Capture bake timestamp  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    openclaw_baked_at: "{{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -u +%FT%TZ')) }}"
  tags: [profile, openclaw]

- name: Write OpenClaw bake metadata
  ansible.builtin.copy:
    dest: "{{ openclaw_install_root }}/.bake-meta"
    owner: agent
    group: agent
    mode: "0644"
    content: |
      version={{ openclaw_pinned_version }}
      node_version={{ openclaw_node_version }}
      baked_at={{ openclaw_baked_at }}
      stub={{ openclaw_use_stub | bool | lower }}
  tags: [profile, openclaw]
