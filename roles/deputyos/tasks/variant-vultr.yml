---
# Vultr variant — cloud-init-recipe target (no custom snapshot).
#
# Same shape as variant-hetzner-cloud.yml: no Packer template, the
# product is cloud-init/vultr.yaml that the user pastes into Vultr's
# Startup Script (cloud-init type) at instance creation.
#
# Reference:
#   docs/03-image-builds.md   §"build matrix" — vultr row.
#   docs/14-limitations.md    §"hetzner / vultr / linode".
#
# Sizing note: Vultr's cheapest VC2 ships 1 GB RAM / 1 vCPU which is below
# the deputyOS minimum. We target VHF-1c-2gb (2 GB) as the realistic floor.

- name: Set vultr facts
  ansible.builtin.set_fact:
    deputyos_clamav_daemon_enabled: true
    deputyos_target_ram_mb: 2048
    deputyos_target_storage_class: "block"
    deputyos_cloud: "vultr"

- name: Ensure cloud-init is present
  ansible.builtin.apt:
    name: cloud-init
    state: present

- name: Verify deputyctl is on PATH
  ansible.builtin.stat:
    path: /usr/local/bin/deputyctl
  register: deputyos_deputyctl_installed
  changed_when: false

- name: Assert deputyctl is installed
  ansible.builtin.assert:
    that:
      - deputyos_deputyctl_installed.stat.exists
      - deputyos_deputyctl_installed.stat.executable
    fail_msg: "deputyctl missing — security-baseline.yml did not install it"
