#cloud-config
# deputyOS — Linode (Akamai) cloud-init recipe.
#
# Paste this YAML into the "Metadata → User Data" field when creating a
# Linode (Linodes that support metadata: most modern shared-CPU/dedicated
# CPU plans). On first boot, cloud-init fetches the deputyOS bundle,
# runs the Ansible role with deputyos_hw=linode, and starts the gateway
# service.
#
# Recommended instance type:
#   * Linode 4 GB (Shared CPU, 2 vCPU, 4 GB RAM, 80 GB SSD) — the
#     wizard-recommended floor; matches our limits.linode.json sizing.
#   * Linode 8 GB — recommended if you plan to run heavy channels
#     concurrently or experiment with local-LLM headroom.
# Nanode 1 GB is below the deputyOS minimum.
#
# Placeholders:
#   <<<USER_SSH_PUBKEY>>>      — your SSH public key (admin user).
#   https://cdn.deputyos.com
#                              — deputyOS distribution base URL; filled in
#                                from the production CDN. See
#                                cloud-init/README.md.
#
# References:
#   docs/03-image-builds.md   §"build matrix" — linode row.
#   docs/14-limitations.md    §"hetzner / vultr / linode".
---
hostname: deputyos
timezone: UTC

disable_root: true
ssh_pwauth: false

users:
  - name: agent
    sudo: false
    shell: /bin/bash
    homedir: /home/agent
    lock_passwd: true
  - name: admin
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - <<<USER_SSH_PUBKEY>>>

write_files:
  - path: /etc/deputyos/active-profile
    content: openclaw
    owner: root:root
    permissions: '0644'
  - path: /etc/deputyos/cloud-init-target
    content: linode
    owner: root:root
    permissions: '0644'

package_update: true
package_upgrade: false
packages:
  - curl
  - ca-certificates
  - python3
  - python3-apt
  - cloud-init

runcmd:
  - [bash, -c, "curl -fsSL https://cdn.deputyos.com/install-cloud.sh \
        | bash -s -- --hw=linode --profile=openclaw --channel=stable"]
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, openclaw-gateway.service]

# Linode-specific notes:
#   * Linode metadata service is at 169.254.169.254 (since 2023). Older
#     plans without metadata support cannot run this recipe — verify
#     the chosen plan in the Linode dashboard before pasting.
#   * Linode's StackScript path is an alternative; we publish only the
#     cloud-init recipe to keep parity with hetzner / vultr.
#   * Linode includes Backups as a paid add-on; deputyctl's B2/R2 path
#     is the recommended primary backup. Linode Backups can be a
#     belt-and-braces second copy.
#   * No audio device; voice features auto-disable per the limits file.
